# Traefik dynamic router for {{ system_name }} ({{ hostname }})
#
# This file is auto-generated by system-docs-domain skill.
# Manual edits will be overwritten on next `configure_domain.py apply`.
#
# Generated: {{ generated_at }}
# System slug: {{ system_slug }}
# Target: {{ target_path }}

http:
  routers:
    wikijs-{{ system_slug }}:
      rule: "Host(`{{ hostname }}`)"
      entryPoints:
        - web
      middlewares:
        - wikijs-forwarded-headers     # shared from wikijs.yml
        - wikijs-{{ system_slug }}-redirect
      service: wikijs                  # shared from wikijs.yml

  middlewares:
    wikijs-{{ system_slug }}-redirect:
      redirectRegex:
        # Match root and any path. Forward path suffix to the L3 landing.
        # /            → /<wiki_locale>/<system>/anvandardokumentation/<doc_locale>
        # /foo         → /<wiki_locale>/<system>/anvandardokumentation/<doc_locale>/foo
        # /?lang=en    → /<wiki_locale>/<system>/anvandardokumentation/en   (handled by Wiki.js L2)
        regex: "^https?://{{ hostname_escaped }}/(.*)$"
        replacement: "{{ tunnel_external_url }}{{ target_path }}/${1}"
        permanent: false
